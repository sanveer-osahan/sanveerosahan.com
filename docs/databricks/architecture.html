<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>4xData support ticket pipeline</title>
<style>
  :root {
    --paper:  #fdfcf9;
    --ink:    #343a40;
    --green:  #2f9e44;
    --red:    #e03131;
    --orange: #f08c00;
    --blue:   #1971c2;
    --muted:  #868e96;
    --hand: "Chalkboard SE", "Bradley Hand", "Comic Sans MS", "Segoe Print", cursive;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 26px 28px 30px;
    background: var(--paper); color: var(--ink);
    font-family: var(--sans);
    display: flex; justify-content: center;
  }
  .sheet { width: 100%; max-width: 1120px; }

  h1 {
    font-family: var(--hand); color: var(--orange);
    font-size: 27px; font-weight: 400; text-align: center; margin: 0 0 22px;
  }

  .plane { border: 2.5px solid var(--green); border-radius: 20px; padding: 18px 20px 24px; background: #fff; }
  .plane-title { font-family: var(--hand); color: var(--orange); font-size: 20px; text-align: center; margin: 0 0 18px; }

  .group { border: 2px solid var(--red); border-radius: 16px; padding: 14px 16px 16px; background: #fff; }
  .group-title { font-family: var(--hand); color: var(--orange); font-size: 16px; text-align: center; margin: 0 0 14px; }

  .node {
    border: 2px solid var(--green); border-radius: 12px;
    padding: 13px 14px; background: #fff; text-align: center;
  }
  .node .name { font-family: var(--hand); color: var(--blue); font-size: 15px; line-height: 1.3; }
  .node .sub  { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .top { display: flex; align-items: center; }
  .sources { width: 210px; flex: none; }
  .sources .node + .node { margin-top: 12px; }
  .databricks { flex: 1; }

  .cap { font-size: 10.5px; color: var(--muted); text-align: center; }
  svg { display: block; margin: 0 auto; }
  .ah { flex: none; width: 56px; text-align: center; }
  .av { text-align: center; padding: 4px 0; }

  .center-300 { max-width: 300px; margin: 0 auto; }

  .medallion { display: flex; align-items: stretch; }
  .medallion .node { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .medallion .ah { width: 42px; display: flex; flex-direction: column; justify-content: center; }

  .tier { font-family: var(--hand); font-size: 16px; }
  .bronze { color: #b06500; }
  .silver { color: #5c7080; }
  .gold   { color: #b8860b; }

  /* the fork: silver feeds the index, gold feeds the chatbot */
  .branch { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-top: 6px; }
  .col { display: flex; flex-direction: column; align-items: center; }
  .col .cap { margin-bottom: 3px; }
  .rule { flex: 1 1 auto; width: 0; border-left: 1.6px solid var(--ink); min-height: 26px; }
  .col .node { width: 84%; }

  .chatbot { border-color: var(--red); margin-top: 2px; }
  .chatbot .name { color: var(--red); font-size: 17px; }

</style>
</head>
<body>
<div class="sheet">

  <h1>4xData Support Ticket Pipeline</h1>

  <div class="top">

    <div class="sources plane">
      <p class="plane-title">Support Tickets</p>
      <div class="node"><div class="name">Issue</div></div>
      <div class="node"><div class="name">Comments</div></div>
      <div class="node"><div class="name">Slack thread</div></div>
      <div class="node"><div class="name">GitHub PR</div></div>
    </div>

    <div class="ah">
      <div class="cap">extract</div>
      <svg width="50" height="14" viewBox="0 0 50 14" aria-hidden="true">
        <line x1="0" y1="7" x2="40" y2="7" stroke="#343a40" stroke-width="1.6"/>
        <polygon points="40,2 50,7 40,12" fill="#343a40"/>
      </svg>
    </div>

    <div class="databricks plane">
      <p class="plane-title">Databricks</p>

      <div class="node center-300"><div class="name">Unity Catalog Volume</div></div>

      <div class="av">
        <svg width="14" height="26" viewBox="0 0 14 26" aria-hidden="true">
          <line x1="7" y1="0" x2="7" y2="17" stroke="#343a40" stroke-width="1.6"/>
          <polygon points="2,17 7,26 12,17" fill="#343a40"/>
        </svg>
      </div>

      <div class="group">
        <p class="group-title">Medallion Architecture</p>
        <div class="medallion">
          <div class="node">
            <div class="name tier bronze">bronze</div>
            <div class="sub">raw data</div>
          </div>
          <div class="ah">
            <svg width="36" height="14" viewBox="0 0 36 14" aria-hidden="true">
              <line x1="0" y1="7" x2="26" y2="7" stroke="#343a40" stroke-width="1.6"/>
              <polygon points="26,2 36,7 26,12" fill="#343a40"/>
            </svg>
          </div>
          <div class="node">
            <div class="name tier silver">silver</div>
            <div class="sub">denormalized</div>
          </div>
          <div class="ah">
            <svg width="36" height="14" viewBox="0 0 36 14" aria-hidden="true">
              <line x1="0" y1="7" x2="26" y2="7" stroke="#343a40" stroke-width="1.6"/>
              <polygon points="26,2 36,7 26,12" fill="#343a40"/>
            </svg>
          </div>
          <div class="node">
            <div class="name tier gold">gold</div>
            <div class="sub">serving the business use case</div>
          </div>
        </div>
      </div>

      <div class="branch">

        <div class="col">
          <div class="cap">from silver</div>
          <svg width="14" height="24" viewBox="0 0 14 24" aria-hidden="true">
            <line x1="7" y1="0" x2="7" y2="15" stroke="#343a40" stroke-width="1.6"/>
            <polygon points="2,15 7,24 12,15" fill="#343a40"/>
          </svg>
          <div class="node"><div class="name">AI Search Index</div></div>
          <svg width="14" height="26" viewBox="0 0 14 26" aria-hidden="true">
            <line x1="7" y1="0" x2="7" y2="17" stroke="#343a40" stroke-width="1.6"/>
            <polygon points="2,17 7,26 12,17" fill="#343a40"/>
          </svg>
        </div>

        <div class="col">
          <div class="cap">from gold</div>
          <div class="rule"></div>
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <polygon points="2,4 7,13 12,4" fill="#343a40"/>
          </svg>
        </div>

      </div>

      <div class="node chatbot"><div class="name">AI Chatbot</div></div>

    </div>
  </div>


</div>
</body>
</html>
